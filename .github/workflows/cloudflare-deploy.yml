name: Cloudflare Deploy

on:
  push:
    branches:
      - codex-chart-service-foundation
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CHART_SERVICE_DATABASE_URL: ${{ secrets.CHART_SERVICE_DATABASE_URL }}
      CHART_SERVICE_SESSION_SECRET: ${{ secrets.CHART_SERVICE_SESSION_SECRET }}
      CHART_SERVICE_BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.CHART_SERVICE_BOOTSTRAP_ADMIN_EMAIL }}
      CHART_SERVICE_BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.CHART_SERVICE_BOOTSTRAP_ADMIN_PASSWORD }}
      CHART_SERVICE_BOOTSTRAP_ADMIN_NAME: ${{ secrets.CHART_SERVICE_BOOTSTRAP_ADMIN_NAME }}
      NODE_ENV: production
      CHART_SERVICE_REPOSITORY: postgres
      CHART_SERVICE_DATABASE_SSL_MODE: require
      CHART_SERVICE_EMAIL_PROVIDER: cloudflare
      CHART_SERVICE_EMAIL_DELIVERY_LIMIT: 50
      CLOUDFLARE_HYPERDRIVE_NAME: tradingcore-hyperdrive
      CLOUDFLARE_HYPERDRIVE_ID: ${{ secrets.CLOUDFLARE_HYPERDRIVE_ID }}
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: ${{ secrets.CHART_SERVICE_DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Verify deployment secrets
        run: |
          set -euo pipefail
          for name in \
            CLOUDFLARE_API_TOKEN \
            CLOUDFLARE_ACCOUNT_ID \
            CHART_SERVICE_DATABASE_URL \
            CHART_SERVICE_SESSION_SECRET \
            CHART_SERVICE_BOOTSTRAP_ADMIN_EMAIL \
            CHART_SERVICE_BOOTSTRAP_ADMIN_PASSWORD \
            CHART_SERVICE_BOOTSTRAP_ADMIN_NAME \
            CLOUDFLARE_ACCOUNT_ID \
            CLOUDFLARE_API_TOKEN
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub secret: $name"
              exit 1
            fi
          done

      - name: Prepare Supabase Postgres database
        run: |
          npm run service:prod-env:check
          npm run service:migrate
          npm run service:bootstrap
          npm run service:postgres:admin-check

      - name: Prepare Cloudflare Hyperdrive binding
        run: node scripts/ensure-cloudflare-hyperdrive.mjs

      - name: Build integrated Next.js Cloudflare worker
        run: npm run service:cloudflare:build

      - name: Upload runtime secrets
        run: |
          set -euo pipefail
          for name in \
            CHART_SERVICE_DATABASE_URL \
            CHART_SERVICE_SESSION_SECRET \
            CHART_SERVICE_BOOTSTRAP_ADMIN_EMAIL \
            CHART_SERVICE_BOOTSTRAP_ADMIN_PASSWORD \
            CHART_SERVICE_BOOTSTRAP_ADMIN_NAME
          do
            printf '%s' "${!name}" | npx wrangler secret put "$name"
          done
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | npx wrangler secret put CHART_SERVICE_CLOUDFLARE_ACCOUNT_ID
          printf '%s' "$CLOUDFLARE_API_TOKEN" | npx wrangler secret put CHART_SERVICE_CLOUDFLARE_API_TOKEN

      - name: Deploy Worker
        run: npx wrangler deploy
