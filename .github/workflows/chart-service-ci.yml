name: Chart Service CI

on:
  push:
    branches:
      - main
      - codex-chart-service-foundation
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm.cmd ci

      - name: Build chart app
        run: npm.cmd run build

  cloudflare-next-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build integrated Next.js Cloudflare worker
        run: npm run service:cloudflare:build
